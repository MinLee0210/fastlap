name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyo3's build script needs a Python interpreter to probe even though
      # the final extension does not link against libpython.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # Non-blocking: reports RUSTSEC advisories against the dependency tree
      # without failing the build on a newly-published advisory.
      - name: cargo audit (advisory report)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

  python:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build + test dependencies
        run: |
          pip install maturin numpy pytest
          pip install scipy lap

      # `maturin develop` requires an activated virtualenv, which the hosted
      # runners don't have. Build a wheel and install it instead — works on
      # Linux/macOS/Windows with no venv and no shell globs.
      - name: Build extension (release)
        run: |
          maturin build --release --out dist
          pip install --force-reinstall --no-deps --no-index --find-links dist fastlap

      - name: Run test suite
        run: pytest -q tests/

  benchmark:
    # Records a machine-readable benchmark run as a build artifact for
    # regression tracking. Correctness is already covered by `python`; this
    # job intentionally does not fail on timing noise.
    name: benchmark (quick, json artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: pip install maturin numpy scipy

      - name: Build extension (release)
        run: |
          maturin build --release --out dist
          pip install --force-reinstall --no-deps --no-index --find-links dist fastlap

      - name: Run quick benchmark sweep
        run: python benchmarks/benchmark.py --quick --json bench.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: bench.json

  py-versions:
    # Compile + smoke test every supported Python version (full pytest only
    # runs where scipy/lap reference wheels are reliably available).
    name: python ${{ matrix.python-version }} smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: pip install maturin numpy

      - name: Build extension
        run: |
          maturin build --release --out dist
          pip install --force-reinstall --no-deps --no-index --find-links dist fastlap

      - name: Smoke test all algorithms + examples
        run: |
          python -c "import fastlap; print(fastlap.get_supported_algorithms())"
          python examples/terminal_ui.py heatmap --size 4
          python examples/terminal_ui.py compare --size 8
